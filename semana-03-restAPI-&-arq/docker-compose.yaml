services:
  backend:
    build:
      context: ./mobile_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mobile
      SPRING_DATASOURCE_USERNAME: mobile
      SPRING_DATASOURCE_PASSWORD: mobile
    env_file:
      - ./mobile_backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./mobile_backend:/app
      - /app/target
      - maven-repo:/root/.m2

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mobile
      POSTGRES_USER: mobile
      POSTGRES_PASSWORD: mobile
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobile -d mobile"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  maven-repo:
  postgres-data: