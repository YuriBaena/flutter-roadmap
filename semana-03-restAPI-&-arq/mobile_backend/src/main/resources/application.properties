spring.application.name=mobile

# Configuração de conexão com o PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/mobile
spring.datasource.username=mobile
spring.datasource.password=mobile
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Hibernate/JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' cria/atualiza as tabelas automaticamente com base nas suas classes Java (ótimo para desenvolvimento)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true